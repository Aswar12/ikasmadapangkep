version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ikasmadapangkep-app
    container_name: ikasmadapangkep-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      - DB_HOST=db
      - DB_DATABASE=laravel
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      - db
    ports:
      - "9000:9000"
    networks:
      - laravel-network

  webserver:
    image: nginx:alpine
    container_name: ikasmadapangkep-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel-network

  db:
    image: mysql:8.0
    container_name: ikasmadapangkep-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ikasmadapangkep-cloudflared
    command: tunnel --no-autoupdate run --token eyJhIjoiNjE1NzhkZDhiMzMxNzYyMzNlNGM3ZjI5MDYwMmJmMzUiLCJ0IjoiYzVhNzU2ODEtMDE2Zi00MDQ3LWEyMGQtZGVhOWNhOWIwMWFhIiwicyI6Ik16YzBNRGxqTVRZdFl6UmtOaTAwWVdNMUxUa3lZMll0WW1WaFlXVTNaakJsTkRBeiJ9
    environment:
      - TUNNEL_URL=http://webserver:80
    restart: unless-stopped
    depends_on:
      - webserver
    networks:
      - laravel-network

volumes:
  mysql_data:

networks:
  laravel-network:
    driver: bridge